<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常用软件导航 · 一键直达官网</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
    :root{
        --ink:#1c2733;
        --muted:#5c6b7a;
        --line:#e3e9f0;
        --bg:#f4f7fb;
        --card:#ffffff;
        --primary:#2f54d0;
        --primary-ink:#1e3bb8;
        --ok:#12a150;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
        font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        background:var(--bg);
        color:var(--ink);
        line-height:1.5;
    }
    /* ===== Hero ===== */
    .hero{
        position:relative;
        background:
            linear-gradient(180deg,rgba(244,247,251,0) 0%,var(--bg) 78%),
            url("https://aka.doubaocdn.com/s/lreIvAG1k2") center 22%/cover no-repeat;
        padding:64px 20px 40px;
        text-align:center;
        overflow:hidden;
    }
    .hero-inner{max-width:880px;margin:0 auto;}
    .hero .kicker{
        display:inline-flex;align-items:center;gap:8px;
        background:#fff;border:1px solid var(--line);border-radius:999px;
        padding:7px 16px;font-size:14px;color:var(--primary-ink);font-weight:500;
        box-shadow:0 2px 10px rgba(20,40,90,.06);
    }
    .hero h1{
        font-size:clamp(30px,5vw,46px);font-weight:900;letter-spacing:.5px;
        margin:18px 0 12px;color:#14223c;
    }
    .hero h1 span{color:var(--primary);}
    .hero p.sub{font-size:clamp(15px,2vw,17px);color:var(--muted);max-width:620px;margin:0 auto;}
    .hero .statbar{
        display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:26px;
    }
    .hero .statbar span{
        background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;
        padding:8px 16px;font-size:14px;color:#33404f;box-shadow:0 2px 8px rgba(20,40,90,.05);
    }
    /* ===== 安全提示 ===== */
    .safe-tip{
        max-width:880px;margin:6px auto 0;padding:0 20px;
    }
    .safe-tip .box{
        background:#eefaf3;border:1px solid #c8ecd7;border-radius:14px;
        padding:14px 18px;display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:#0d5c33;
    }
    .safe-tip svg{flex:none;margin-top:2px;}
    /* ===== 分类区 ===== */
    .wrap{max-width:1040px;margin:36px auto 10px;padding:0 20px;}
    .group{margin-bottom:34px;}
    .group-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
    .group-icon{
        width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;
        color:#fff;
    }
    .group-head h2{font-size:20px;font-weight:700;color:#1a2a3f;}
    .group-head .count{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:2px 10px;border-radius:999px;}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
    .card{
        background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:18px;display:flex;flex-direction:column;gap:14px;
        transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
        position:relative;
    }
    .card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(20,40,90,.10);border-color:#cdd9ec;}
    .card-top{display:flex;align-items:center;gap:12px;}
    .app-icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
    .app-name{font-size:17px;font-weight:700;color:#16233a;line-height:1.2;}
    .app-desc{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4;}
    .badge{
        display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
        color:var(--ok);background:#eaf8f0;border:1px solid #c9ecd8;padding:2px 8px;border-radius:999px;flex:none;
    }
    .card .domain{
        font-size:12px;color:#8a98a8;word-break:break-all;
        background:#f5f8fc;border:1px solid var(--line);padding:6px 9px;border-radius:8px;
    }
    .btn-go{
        margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;
        background:var(--primary);color:#fff;border:none;border-radius:11px;
        padding:12px 10px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;
        transition:background .18s ease;
    }
    .btn-go:hover{background:var(--primary-ink);}
    .btn-go svg{transition:transform .18s ease;}
    .btn-go:hover svg{transform:translateX(3px);}
    /* ===== 页脚 ===== */
    footer{max-width:1040px;margin:44px auto 60px;padding:0 20px;text-align:center;color:#9aa7b6;font-size:13px;line-height:2;}
    footer .foot-line{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;}
    footer a{color:var(--primary-ink);text-decoration:none;}
    footer a:hover{text-decoration:underline;}
    @media (max-width:640px){
        .hero{padding:44px 16px 28px;}
        .cards{grid-template-columns:1fr 1fr;gap:11px;}
        .card{padding:14px;gap:12px;}
        .app-name{font-size:15.5px;}
        .app-desc{font-size:12px;}
    }
    @media (max-width:400px){
        .cards{grid-template-columns:1fr;}
    }
</style>
</head>
<body>

<!-- ===== Hero ===== -->
<header class="hero">
    <div class="hero-inner">
        <span class="kicker">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-4z"/><path d="M9 12l2 2 4-4"/></svg>
            全部来自软件官方网站
        </span>
        <h1>常用软件 <span>官方导航</span></h1>
        <p class="sub">一次收齐你常用的装机软件，点击按钮直达官方网站下载，远离第三方捆绑安装包。</p>
        <div class="statbar">
            <span>20+ 常用软件</span>
            <span>10 个分类</span>
            <span>一键直达官网</span>
            <span>免费 · 纯净</span>
        </div>
    </div>
</header>

<!-- ===== 安全提示 ===== -->
<div class="safe-tip">
    <div class="box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <div><strong>安装提醒：</strong>请务必通过本页按钮跳转的官方网址下载安装，不要轻信搜索引擎里的仿冒站点与第三方下载站，避免误装捆绑软件或木马。</div>
    </div>
</div>

<main class="wrap" id="app"></main>

<footer>
    <div class="foot-line">
        <span>本站为纯静态导航页，不含任何安装包</span>
        <a href="#app">返回顶部</a>
    </div>
    <div>点击任意按钮将在新窗口打开对应软件官网</div>
</footer>

<script>
// ===== 软件数据 =====
const CATS = [
  {key:"record", name:"录屏 · 直播", color:"#e8590c"},
  {key:"secure", name:"安全防护",   color:"#0b7285"},
  {key:"browser",name:"浏览器",     color:"#1c7ed6"},
  {key:"office", name:"办公工具",   color:"#7048e8"},
  {key:"chat",   name:"通讯 · 会议", color:"#2f9e44"},
  {key:"archive",name:"压缩解压",   color:"#e67700"},
  {key:"find",   name:"搜索 · 下载", color:"#e03131"},
  {key:"media",  name:"影音播放",   color:"#d6336c"},
  {key:"code",   name:"编辑器 · 编程", color:"#4263eb"},
  {key:"cloud",  name:"网盘 · 存储", color:"#1098ad"}
];

// 图标：几何简化符号（不仿制品牌 Logo）
const ICONS = {
  record:  '<path d="M6 4h12v10a6 6 0 0 1-6 6 6 6 0 0 1-6-6V4z"/><path d="M6 8h12"/>',          // 摄像机
  secure:  '<path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-4z"/><path d="M9 12l2 2 4-4"/>', // 盾牌
  browser: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/>', // 地球
  office:  '<path d="M7 3h7l4 4v14H7V3z"/><path d="M14 3v4h4"/><path d="M10 12h6M10 16h6"/>',       // 文档
  chat:    '<path d="M4 6h16v11H10l-6 4V6z"/><path d="M8 10h8M8 13h5"/>',                          // 聊天气泡
  archive: '<path d="M4 8l8-4 8 4v9l-8 4-8-4V8z"/><path d="M4 8l8 4 8-4"/><path d="M12 12v9"/>',    // 压缩盒
  find:    '<circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/><path d="M8 11h6"/>',              // 放大镜
  media:   '<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5-6-3.5z"/>',                    // 播放
  code:    '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/><path d="M13 4l-2 16"/>',                        // 代码
  cloud:   '<path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A4.5 4.5 0 0 1 17 18H7z"/><path d="M12 10v7M9 13l3-3 3 3"/>' // 云/上传
};

const SOFTWARES = [
  // 录屏 · 直播
  {cat:"record", name:"OBS Studio", desc:"免费开源录屏与直播推流", url:"https://obsproject.com/", domain:"obsproject.com"},
  {cat:"record", name:"剪映专业版", desc:"字节跳动出品的视频剪辑软件",   url:"https://www.capcut.cn/", domain:"capcut.cn"},
  // 安全防护
  {cat:"secure", name:"火绒安全", desc:"轻巧干净的电脑防护软件",   url:"https://www.huorong.cn/", domain:"huorong.cn"},
  // 浏览器
  {cat:"browser",name:"Chrome 谷歌浏览器", desc:"谷歌官方浏览器", url:"https://www.google.com/chrome/", domain:"google.com/chrome"},
  {cat:"browser",name:"Microsoft Edge", desc:"微软系统自带浏览器", url:"https://www.microsoft.com/edge", domain:"microsoft.com/edge"},
  {cat:"browser",name:"Firefox 火狐", desc:"注重隐私的开源浏览器", url:"https://www.mozilla.org/zh-CN/firefox/", domain:"mozilla.org/firefox"},
  // 办公工具
  {cat:"office", name:"WPS Office", desc:"国产办公套件",         url:"https://www.wps.cn/", domain:"wps.cn"},
  {cat:"office", name:"LibreOffice", desc:"免费开源办公套件",     url:"https://www.libreoffice.org/", domain:"libreoffice.org"},
  {cat:"office", name:"Notion", desc:"笔记与协作工作台",          url:"https://www.notion.so/", domain:"notion.so"},
  // 通讯 · 会议
  {cat:"chat", name:"微信", desc:"日常通讯与社交",          url:"https://weixin.qq.com/", domain:"weixin.qq.com"},
  {cat:"chat", name:"QQ", desc:"腾讯即时通讯",              url:"https://im.qq.com/", domain:"im.qq.com"},
  {cat:"chat", name:"企业微信", desc:"企业办公协同",          url:"https://work.weixin.qq.com/", domain:"work.weixin.qq.com"},
  {cat:"chat", name:"腾讯会议", desc:"视频会议与在线协作",     url:"https://meeting.tencent.com/", domain:"meeting.tencent.com"},
  {cat:"chat", name:"钉钉", desc:"企业协同办公平台",         url:"https://www.dingtalk.com/", domain:"dingtalk.com"},
  // 压缩解压
  {cat:"archive", name:"7-Zip", desc:"免费高压缩比解压工具",  url:"https://www.7-zip.org/", domain:"7-zip.org"},
  {cat:"archive", name:"Bandizip", desc:"轻量好用的压缩软件", url:"https://www.bandisoft.com/", domain:"bandisoft.com"},
  // 搜索 · 下载
  {cat:"find", name:"Everything", desc:"秒搜电脑文件的神器", url:"https://www.voidtools.com/", domain:"voidtools.com"},
  {cat:"find", name:"迅雷", desc:"高速下载工具",           url:"https://www.xunlei.com/", domain:"xunlei.com"},
  // 影音播放
  {cat:"media", name:"PotPlayer", desc:"功能强大的视频播放器", url:"https://potplayer.daum.net/", domain:"potplayer.daum.net"},
  {cat:"media", name:"VLC", desc:"全能免费开源播放器",       url:"https://www.videolan.org/vlc/", domain:"videolan.org/vlc"},
  // 编辑器 · 编程
  {cat:"code", name:"Notepad++", desc:"轻量文本代码编辑器",  url:"https://notepad-plus-plus.org/", domain:"notepad-plus-plus.org"},
  {cat:"code", name:"Visual Studio Code", desc:"微软开源代码编辑器", url:"https://code.visualstudio.com/", domain:"code.visualstudio.com"},
  // 网盘 · 存储
  {cat:"cloud", name:"百度网盘", desc:"云存储与文件分享",    url:"https://pan.baidu.com/", domain:"pan.baidu.com"},
];

// ===== 渲染 =====
const catMap = Object.fromEntries(CATS.map(c=>[c.key,c]));

function render(){
  const app = document.getElementById("app");
  const html = CATS.map(cat=>{
    const items = SOFTWARES.filter(s=>s.cat===cat.key);
    if(!items.length) return "";
    const icon = ICONS[cat.key];
    const cards = items.map(s=>`
      <div class="card">
        <div class="card-top">
          <div class="app-icon" style="background:${cat.color}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
          </div>
          <div>
            <div class="app-name">${s.name}</div>
            <span class="badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
              官方
            </span>
          </div>
        </div>
        <div class="app-desc">${s.desc}</div>
        <div class="domain">${s.domain}</div>
        <a class="btn-go" href="${s.url}" target="_blank" rel="noopener noreferrer">
          前往官网下载
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    `).join("");
    return `
      <section class="group">
        <div class="group-head">
          <div class="group-icon" style="background:${cat.color}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
          </div>
          <h2>${cat.name}</h2>
          <span class="count">${items.length} 款</span>
        </div>
        <div class="cards">${cards}</div>
      </section>
    `;
  }).join("");
  app.innerHTML = html;
}
render();
</script>
</body>
</html>
